<mat-card>
  <h2>Weather Overview</h2>
  <table mat-table [dataSource]="testWeatherData">

    <!-- City Column -->
    <ng-container matColumnDef="city">
      <th mat-header-cell *matHeaderCellDef> City </th>
      <td mat-cell *matCellDef="let element"> {{ element.city }} </td>
    </ng-container>

    <!-- Temperature Column -->
    <ng-container matColumnDef="temp">
      <th mat-header-cell *matHeaderCellDef> Temperature (°C) </th>
      <td mat-cell *matCellDef="let element"> {{ element.data?.current.temp }} </td>
    </ng-container>

    <!-- Humidity Column -->
    <ng-container matColumnDef="humidity">
      <th mat-header-cell *matHeaderCellDef> Humidity (%) </th>
      <td mat-cell *matCellDef="let element"> {{ element.data?.current.humidity }} </td>
    </ng-container>

    <!-- Condition Column -->
    <ng-container matColumnDef="condition">
      <th mat-header-cell *matHeaderCellDef> Condition </th>
      <td mat-cell *matCellDef="let element"> {{ element.data?.current.weather[0]?.description }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-card>
