<mat-card>
  <h2>Weather Overview</h2>

  @if (isLoading) {
  <div class="loading-spinner">
    <mat-spinner></mat-spinner>
  </div>
  } @else {
  <mat-form-field appearance="fill">
    <mat-label>Filter</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Filter cities" />
  </mat-form-field>

  @if (dataSource.filteredData.length === 0) {
  <div class="no-results">No results found</div>
  } @else {
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">

    @for(column of displayedColumns; track column) {
    <ng-container [matColumnDef]="column.id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>
        {{ column.label }}
      </th>
      <td mat-cell *matCellDef="let row">
        {{ row[column.id] ?? '--' }}
      </td>
    </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumnIds"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumnIds" (click)="onCityClick(row)" class="clickable-row">
    </tr>

  </table>
  }
  }

  @if (chartVisible) {
  <div class="chart-container">
    <canvas baseChart [datasets]="chartData" [labels]="chartLabels" [options]="chartOptions" [legend]="chartLegend"
      [type]="selectedChartType">
    </canvas>
  </div>
  }
</mat-card>
