<mat-form-field class="full-width">
  <mat-label>Select Cities</mat-label>
  <input type="text" matInput [formControl]="cityControl" [matAutocomplete]="auto">

  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onCitySelect($event.option.value)">
    @for( city of citySuggestions$ | async; track city.name) {
    <mat-option [value]="city.name">
      {{ city.name }} - {{ city.country }}
    </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
